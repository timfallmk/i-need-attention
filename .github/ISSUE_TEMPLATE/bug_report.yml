name: Bug report
description: Something in the app doesn't behave as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't report security problems here — see
        [SECURITY.md](../blob/main/SECURITY.md) for the private route.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Which side was affected
      description: Almost every bug here is one-directional, and knowing which end saw it narrows it enormously.
      options:
        - The phone that sent
        - The phone that received
        - Both
        - Neither / not about an alert
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: App state on the affected phone
      description: Whether the app was running changes which code path ran — a force-quit app is served entirely by the notification extension.
      options:
        - Open and in the foreground
        - Backgrounded
        - Force-quit
        - Not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings → Export diagnostics, then paste it here. It shows you the whole report
        before you send it and contains no names, messages or emoji.
      render: text
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "2.1.0"
  - type: input
    id: os
    attributes:
      label: iOS version, and watchOS if the watch is involved
