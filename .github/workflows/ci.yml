name: CI

# A macOS runner bills at 10x the Linux rate and the Xcode job takes ~5 minutes, so a
# change that cannot possibly affect the build result is worth not running. Four paths
# qualify: Markdown, plain text, LICENSE, and site/. Nothing compiles any of them — the
# one Markdown file that ships (App/Resources/SOUND_PLACEHOLDER.md, bundled because
# XcodeGen takes App/Resources wholesale) is inert cargo the build never reads, and
# site/ is the GitHub Pages site, which has a workflow of its own. This file is
# deliberately not among them: a change to it must run under itself.
#
# .txt is here because TestFlight/WhatToTest.en-US.txt is a tracked file that Xcode
# Cloud reads at archive time, so tester notes get reviewed in a PR — and every such
# PR was paying five macOS minutes to compile nothing. The repo's only other .txt,
# Tools/data/emoji-test.txt, feeds a dev-time generator rather than the build. A .txt
# dropped into App/Resources would be bundled and still exempt, on the same reasoning
# as SOUND_PLACEHOLDER.md: it changes what is in the bundle, not whether it builds.
#
# That saving used to live in `paths-ignore` at the trigger, which had a trap the comment
# here warned about and branch protection walked into anyway: a PR touching only those
# paths got no check at all, so a required "Build" never reported and the PR could not be
# merged. Filtering at the trigger cannot satisfy a required check, because a workflow
# that does not run reports nothing.
#
# So the filter moved inside. Three jobs:
#
#   changes  cheap Linux job; decides whether anything outside those paths moved
#   xcode    the real work, skipped when it did not — this is where the saving is
#   Build    cheap Linux job that always runs and always reports, failing iff xcode did
#
# `Build` is the required check. It costs one Linux minute on a docs-only change instead
# of five macOS minutes, and it always exists, which is the whole point. Renaming it means
# updating branch protection in the same breath, or nothing can merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether anything buildable changed
        id: filter
        run: |
          set -euo pipefail
          # `|| true` on every diff, deliberately. A base or before-SHA can be
          # unreachable — a force-push that stranded the old tip, a base commit not in
          # this clone — and `set -e` would then fail the job and block the merge, which
          # is the opposite of the "build rather than guess" rule below. An unreadable
          # diff has to look the same as an absent one.
          case "${{ github.event_name }}" in
            pull_request)
              files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" 2>/dev/null || true)
              ;;
            push)
              before="${{ github.event.before }}"
              if [ "$before" = "0000000000000000000000000000000000000000" ]; then
                files=""
              else
                files=$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null || true)
              fi
              ;;
            *)
              files=""
              ;;
          esac

          # An empty list means we could not work out what moved — a first push, a
          # manual dispatch, a force-push that stranded the old tip. Build rather than
          # guess: a wasted run is cheaper than a missed one.
          if [ -z "$files" ]; then
            echo "no diff available; building"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything that is not Markdown, plain text, LICENSE, or under site/ counts
          # as buildable.
          if grep -qvE '(\.md$|\.txt$|^LICENSE$|^site/)' <<<"$files"; then
            code=true
            verdict='Buildable changes found — the Xcode job will run.'
          else
            code=false
            verdict='Only Markdown, text, LICENSE or `site/` changed — the Xcode job will be skipped.'
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

          {
            echo "### Change detection"
            echo
            echo "$verdict"
            echo
            echo "<details><summary>Changed files</summary>"
            echo
            echo '```'
            echo "$files"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  xcode:
    name: Xcode build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Signing config guard
        run: |
          set -euo pipefail
          targets=$(xcodebuild -list -project Attention.xcodeproj -json \
            | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)["project"]["targets"]))')
          fail=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            if ! settings=$(xcodebuild -project Attention.xcodeproj -target "$t" -showBuildSettings 2>/dev/null); then
              echo "::error::could not read build settings for $t - the guard cannot verify it"
              fail=1
              continue
            fi
            # Only bundles (.app/.appex/.xctest) need an Info.plist to be signed.
            # AttentionCLI is a bare Mach-O tool and legitimately has none, so key off
            # WRAPPER_EXTENSION rather than maintaining an exclusion list by hand.
            grep -qE '^[[:space:]]*WRAPPER_EXTENSION = ' <<<"$settings" || continue
            if ! grep -qE '^[[:space:]]*(GENERATE_INFOPLIST_FILE = YES|INFOPLIST_FILE = [^[:space:]])' <<<"$settings"; then
              echo "::error::$t is a bundle target with neither INFOPLIST_FILE nor GENERATE_INFOPLIST_FILE=YES, so it cannot be code signed"
              fail=1
            fi
          done <<<"$targets"
          exit $fail

      - name: Test Attention (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Attention.xcodeproj \
            -scheme Attention \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=

      - name: Build AttentionCLI (macOS)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Attention.xcodeproj \
            -scheme AttentionCLI \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=

  build:
    name: Build
    needs: [changes, xcode]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report the Xcode job's result
        run: |
          set -euo pipefail
          changes='${{ needs.changes.result }}'
          xcode='${{ needs.xcode.result }}'
          echo "changes=$changes xcode=$xcode"

          # `skipped` is the success case for a docs-only change: nothing buildable moved,
          # so there was nothing to run. Every other non-success is a failure, including
          # `cancelled`, so a cancelled run can never look like a passing required check.
          if [ "$changes" != "success" ]; then
            echo "::error::the change detector did not succeed ($changes)"
            exit 1
          fi
          case "$xcode" in
            success)
              echo "::notice::Xcode build and test passed."
              echo "Build passed: the Xcode job ran and succeeded." >> "$GITHUB_STEP_SUMMARY"
              ;;
            skipped)
              # Worth saying loudly. This check is required, so a green Build is what a
              # reviewer sees — and on a docs-only change it means nothing was compiled,
              # which is not the same claim as a passing build.
              echo "::notice::Nothing buildable changed, so no code was compiled. This check passed without building."
              echo "Build passed **without compiling anything** — only Markdown, LICENSE or \`site/\` changed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Xcode build and test $xcode"
              exit 1
              ;;
          esac
