name: Attention
options:
  bundleIdPrefix: com.timfallmk.attention
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: T5VJ9JRCNB
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Attention:
    build:
      targets:
        Attention: all
        AttentionNotificationService: all
        AttentionWatch: all
        AttentionWatchWidget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Attention:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
      - path: Shared
    resources:
      - App/Resources
    dependencies:
      - target: AttentionWatch
      - target: AttentionNotificationService
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Please Give Me Attention
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "Used once during pairing so you can scan the other phone's QR code."
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Attention.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AttentionNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NotificationService
      - path: Shared
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: AttentionNotificationService
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention.notification-service
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        SKIP_INSTALL: YES

  AttentionWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/Watch
      - path: Shared
    dependencies:
      - target: AttentionWatchWidget
    info:
      path: Watch/Watch/Info.plist
      properties:
        CFBundleDisplayName: Attention
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.timfallmk.attention
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Watch/Watch/Watch.entitlements
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  AttentionWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/WatchWidget
      - path: Shared
    info:
      path: Watch/WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Attention
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention.watchkitapp.widget
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
