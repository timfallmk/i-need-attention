name: Attention
options:
  bundleIdPrefix: com.timfallmk.attention
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: T5VJ9JRCNB
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Attention:
    build:
      targets:
        Attention: all
        AttentionNotificationService: all
        AttentionWatch: all
        AttentionWatchWidget: all
        AttentionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AttentionTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AttentionCLI:
    build:
      targets:
        AttentionCLI: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Attention:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
      - path: Shared
    resources:
      - App/Resources
    dependencies:
      - target: AttentionWatch
      - target: AttentionNotificationService
    info:
      path: App/Info.plist
      properties:
        # Home-screen name, which is NOT the App Store name — that lives only in
        # App Store Connect and stays "Please Give Me Attention". iOS squeezes a
        # 24-character name down to "PleaseGive…" under the icon, so the long form
        # bought nothing but truncation. Matches the watch app and widget, which
        # have always used the short form.
        CFBundleDisplayName: Attention
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "Used once during pairing so you can scan the other phone's QR code."
        CFBundleURLTypes:
          - CFBundleURLName: com.timfallmk.attention.pair
            CFBundleURLSchemes:
              - attention
        # False because all cryptography here is CryptoKit — ChaChaPoly and
        # HKDF<SHA256> in Shared/PairCrypto.swift — which Apple classifies as
        # OS-provided and exempt from export documentation. It was originally set
        # when the app had no encryption at all, so the answer survived 2.0 by
        # luck rather than by reasoning. Vendoring a crypto library or hand-rolling
        # a cipher would make it wrong: see SETUP.md §7a before changing anything here.
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Attention.entitlements
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Substituted into App/Attention.entitlements. Production is the safe default:
        # an unset value would produce an empty entitlement and no push at all.
        APS_ENVIRONMENT: production
      configs:
        # A Debug build runs against the Development CloudKit container, which sends its
        # pushes through sandbox APNs. Registering for a production token there gets no
        # error and no delivery — which is exactly how push testing on a debug build
        # looks broken while every foreground read keeps working.
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  AttentionNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NotificationService
      - path: Shared
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: AttentionNotificationService
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention.notification-service
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        SKIP_INSTALL: YES

  AttentionWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/Watch
      - path: Shared
    dependencies:
      - target: AttentionWatchWidget
    info:
      path: Watch/Watch/Info.plist
      properties:
        CFBundleDisplayName: Attention
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.timfallmk.attention
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Watch/Watch/Watch.entitlements
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  AttentionWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/WatchWidget
      - path: Shared
    info:
      path: Watch/WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Attention
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention.watchkitapp.widget
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"

  AttentionCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tools/AttentionCLI/Sources
      - path: Shared
      - path: App/Models/PairState.swift
      - path: App/Models/ZoneRef.swift
      - path: App/Models/AlertRecord.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention.cli
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  AttentionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AttentionTests
      - path: Shared/Constants.swift
      - path: Shared/WatchSnapshot.swift
      - path: Shared/SharedSettings.swift
      - path: Shared/SubscriptionPredicates.swift
      - path: Shared/UntrustedText.swift
      - path: Shared/PairCrypto.swift
      - path: Shared/PairSecretStore.swift
      - path: App/Models/PairState.swift
      - path: App/Models/ZoneRef.swift
      - path: App/Models/PendingInvite.swift
      - path: App/Models/SnoozeState.swift
      - path: App/Models/AlertRecord.swift
      - path: App/Models/ArchivedAlert.swift
      - path: App/Models/LegacyHistoryArchive.swift
      - path: App/Models/PairingArchive.swift
      - path: App/Models/InboxZone.swift
      - path: App/Models/DataErasure.swift
      - path: App/Models/DiagnosticsReport.swift
      - path: App/Models/MetricKitSummary.swift
      - path: App/Models/UserSettings.swift
      - path: App/Models/NounPresets.swift
      - path: App/Models/OpenSourceLicenses.swift
      - path: App/Helpers/DeviceIdentity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timfallmk.attention.tests
        CODE_SIGN_STYLE: Automatic
        # Signing a test bundle requires an Info.plist. Unlike the four app/extension
        # targets this one has no `info:` block, so Xcode must synthesize one — without
        # this the local `xcodebuild test` fails at CreateBuildDescription. CI doesn't
        # hit it because it builds with CODE_SIGNING_ALLOWED=NO.
        GENERATE_INFOPLIST_FILE: YES
